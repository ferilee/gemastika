  <rect width="1200" height="650" fill="#eef2f8"/><rect x="112" y="38" width="976" height="570" rx="24" fill="white" stroke="#d8e2f0"/><text x="152" y="92" font-family="Arial" font-size="26" font-weight="800" fill="#17213b">Bagikan materi pembelajaran</text><text x="152" y="120" font-family="Arial" font-size="15" fill="#64748b">Materi yang dikirim harus berupa PDF dan menunggu review pengurus.</text><g font-family="Arial" font-size="13" fill="#475569"><text x="152" y="168">Judul materi</text><rect x="152" y="180" width="420" height="42" rx="9" fill="white" stroke="#cbd5e1"/><text x="168" y="207" fill="#94a3b8">RPP Matematika Kelas XI</text><text x="610" y="168">Kategori</text><rect x="610" y="180" width="438" height="42" rx="9" fill="white" stroke="#cbd5e1"/><text x="626" y="207" fill="#334155">RPP / Modul Ajar                 ⌄</text><text x="152" y="268">Deskripsi</text><rect x="152" y="280" width="896" height="72" rx="9" fill="white" stroke="#cbd5e1"/><text x="168" y="307" fill="#94a3b8">Jelaskan isi dan manfaat materi.</text><text x="152" y="397">File materi</text><rect x="152" y="410" width="896" height="70" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="7 5"/><text x="600" y="440" text-anchor="middle" font-size="16" font-weight="700" fill="#2563eb">Pilih file PDF</text><text x="600" y="463" text-anchor="middle" font-size="12" fill="#64748b">Format yang diterima: PDF · maksimum 20 MB</text><rect x="152" y="522" width="896" height="44" rx="10" fill="#059669"/><text x="600" y="550" text-anchor="middle" font-size="15" font-weight="700" fill="white">Kirim materi untuk ditinjau</text></g></svg>
