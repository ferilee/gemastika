  <text x="68" y="153" font-family="Arial" font-size="11" font-weight="700" letter-spacing="2" fill="#64748b">PERJALANAN ANGGOTA</text><text x="68" y="190" font-family="Arial" font-size="22" font-weight="800" fill="#16213c">Satu langkah pada</text><text x="68" y="218" font-family="Arial" font-size="22" font-weight="800" fill="#16213c">satu waktu.</text><text x="68" y="256" font-family="Arial" font-size="14" fill="#64748b">Kenali ruang anggota dan temukan cara untuk ikut berkontribusi.</text>
