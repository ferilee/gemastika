<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Ilustrasi wizard anggota langkah profil</title>
  <desc id="desc">Wizard anggota Gemastika pada langkah profil dengan status anggota aktif.</desc>
  <rect width="1600" height="820" fill="#f5f7fb"/>
  <text x="26" y="32" font-family="Arial" font-size="12" font-weight="700" letter-spacing="3" fill="#5b00e8">DASHBOARD ANGGOTA</text>
  <text x="26" y="64" font-family="Arial" font-size="25" font-weight="800" fill="#151a38">Ruang perjalanan Anda</text>
  <text x="26" y="88" font-family="Arial" font-size="13" fill="#71809b">Ikuti langkahnya untuk melihat aktivitas, kontribusi, dan perkembangan keanggotaan.</text>
  <rect x="26" y="108" width="1548" height="680" rx="28" fill="white" stroke="#e1e7f0"/>
  <rect x="26" y="108" width="250" height="680" rx="28" fill="#fbfcff"/><line x1="276" y1="108" x2="276" y2="788" stroke="#e1e7f0"/>
  <circle cx="68" cy="150" r="22" fill="#e3c99d"/><text x="68" y="158" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">F</text><text x="104" y="149" font-family="Arial" font-size="14" font-weight="700" fill="#151a38">Feri Lee</text><text x="104" y="168" font-family="Arial" font-size="10" fill="#71809b">ferilee@smkpasir...</text><text x="206" y="157" font-family="Arial" font-size="18" fill="#f59e0b">⚙</text>
  <text x="50" y="214" font-family="Arial" font-size="10" font-weight="700" letter-spacing="2" fill="#71809b">PERJALANAN ANGGOTA</text><text x="50" y="250" font-family="Arial" font-size="19" font-weight="800" fill="#151a38">Satu langkah pada</text><text x="50" y="274" font-family="Arial" font-size="19" font-weight="800" fill="#151a38">satu waktu.</text><text x="50" y="309" font-family="Arial" font-size="13" fill="#71809b">Kenali ruang Anda di MGMP dan temukan cara untuk ikut berkontribusi.</text>
  <line x1="75" y1="380" x2="75" y2="595" stroke="#dbe5f3" stroke-width="2"/><g font-family="Arial"><circle cx="75" cy="375" r="21" fill="#5b00e8" stroke="#eadcff" stroke-width="6"/><text x="75" y="382" text-anchor="middle" font-size="15" font-weight="700" fill="white">⌾</text><text x="112" y="377" font-size="14" font-weight="700" fill="#5b00e8">Profil</text><text x="112" y="395" font-size="10" fill="#a2afc3">Data keanggotaan</text><circle cx="75" cy="450" r="21" fill="white" stroke="#edf1f7" stroke-width="2"/><text x="75" y="457" text-anchor="middle" font-size="14" fill="#a2afc3">▦</text><text x="112" y="452" font-size="14" font-weight="700" fill="#71809b">Kegiatan</text><text x="112" y="470" font-size="10" fill="#a2afc3">Agenda dan hadir</text><circle cx="75" cy="525" r="21" fill="white" stroke="#edf1f7" stroke-width="2"/><text x="75" y="532" text-anchor="middle" font-size="14" fill="#a2afc3">▣</text><text x="112" y="527" font-size="14" font-weight="700" fill="#71809b">Kontribusi</text><text x="112" y="545" font-size="10" fill="#a2afc3">Karya dan berbagi</text><circle cx="75" cy="600" r="21" fill="white" stroke="#edf1f7" stroke-width="2"/><text x="75" y="607" text-anchor="middle" font-size="14" fill="#a2afc3">♜</text><text x="112" y="602" font-size="14" font-weight="700" fill="#71809b">Progres</text><text x="112" y="620" font-size="10" fill="#a2afc3">XP dan peringkat</text></g>
  <text x="315" y="151" font-family="Arial" font-size="11" font-weight="700" letter-spacing="2" fill="#9aa9c0">LANGKAH 1 DARI 4</text><text x="315" y="193" font-family="Arial" font-size="28" font-weight="800" fill="#151a38">Bagaimana status profil keanggotaan Anda?</text><text x="315" y="222" font-family="Arial" font-size="14" fill="#71809b">Data keanggotaan. Pilih kartu untuk membuka halaman terkait.</text><rect x="1450" y="136" width="90" height="24" rx="12" fill="#d1fae5"/><text x="1495" y="153" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#059669">ANGGOTA AKTIF</text>
  <rect x="315" y="260" width="580" height="142" rx="18" fill="#f0eaff" stroke="#6d20ff" stroke-width="2"/><circle cx="350" cy="294" r="20" fill="#5b00e8"/><text x="350" y="301" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="white">⌾</text><text x="382" y="302" font-family="Arial" font-size="15" font-weight="800" fill="#151a38">Profil sudah terdaftar</text><text x="340" y="344" font-family="Arial" font-size="12" fill="#71809b">SMK Negeri 1 Bandung - Kota Bandung - Jawa Barat</text><text x="340" y="374" font-family="Arial" font-size="11" font-weight="700" fill="#5b00e8">Anggota aktif</text><text x="870" y="294" text-anchor="middle" font-family="Arial" font-size="18" fill="#5b00e8">⌾</text>
  <rect x="920" y="260" width="580" height="142" rx="18" fill="white" stroke="#e1e7f0"/><circle cx="955" cy="294" r="20" fill="#f1f4f9"/><text x="955" y="301" text-anchor="middle" font-family="Arial" font-size="16" fill="#5b00e8">♙</text><text x="987" y="302" font-family="Arial" font-size="15" font-weight="800" fill="#151a38">Lihat identitas publik</text><text x="944" y="344" font-family="Arial" font-size="12" fill="#71809b">Periksa bagaimana nama dan sekolah Anda ditampilkan</text><text x="944" y="362" font-family="Arial" font-size="12" fill="#71809b">di daftar anggota MGMP.</text><text x="944" y="387" font-family="Arial" font-size="11" font-weight="700" fill="#5b00e8">Feri Lee</text><text x="1475" y="302" text-anchor="middle" font-family="Arial" font-size="18" fill="#c4cedd">→</text>
  <line x1="315" y1="700" x2="1500" y2="700" stroke="#e1e7f0"/><text x="315" y="744" font-family="Arial" font-size="13" font-weight="700" fill="#a2afc3">← Sebelumnya</text><rect x="1340" y="720" width="160" height="38" rx="10" fill="#5b00e8"/><text x="1420" y="744" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="white">Langkah berikutnya →</text>
</svg>
