<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Ilustrasi modal agenda dan formulir kontribusi</title>
  <desc id="desc">Kartu agenda dengan tombol Hadir dan formulir kontribusi anggota.</desc>
  <rect width="1200" height="720" fill="#eef2f8"/><g font-family="Arial"><rect x="48" y="42" width="532" height="620" rx="24" fill="white" stroke="#d8e2f0"/><text x="82" y="94" font-size="25" font-weight="800" fill="#17213b">Agenda mendatang</text><text x="82" y="121" font-size="15" fill="#64748b">Kegiatan yang masih dapat Anda ikuti.</text><rect x="82" y="155" width="464" height="144" rx="16" fill="#f8fafc" stroke="#dbe5f3"/><text x="108" y="199" font-size="19" font-weight="800" fill="#1e293b">Pertemuan MGMP</text><text x="108" y="229" font-size="14" fill="#64748b">30 Oktober 2026 · 13:00 · SMKS Kalijogo</text><rect x="108" y="248" width="110" height="34" rx="9" fill="#2563eb"/><text x="163" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="white">Hadir</text><text x="234" y="270" font-size="12" fill="#64748b">aktif saat waktu dibuka admin</text><rect x="82" y="342" width="464" height="96" rx="14" fill="#ecfdf5" stroke="#bbf7d0"/><text x="108" y="379" font-size="16" font-weight="700" fill="#047857">Kehadiran berhasil dicatat</text><text x="108" y="405" font-size="14" fill="#065f46">XP +10 akan ditambahkan ke progres anggota.</text><text x="82" y="593" font-size="12" fill="#64748b">Jika tombol belum aktif, jadwal presensi belum dibuka.</text>
  <rect x="618" y="42" width="534" height="620" rx="24" fill="white" stroke="#d8e2f0"/><text x="652" y="94" font-size="25" font-weight="800" fill="#17213b">Tambah portofolio</text><text x="652" y="121" font-size="15" fill="#64748b">Kirim karya untuk diperiksa pengurus.</text><g font-size="13" fill="#475569"><text x="652" y="170">Judul karya</text><rect x="652" y="180" width="466" height="40" rx="9" fill="white" stroke="#cbd5e1"/><text x="668" y="205" fill="#94a3b8">Contoh: Praktik baik pembelajaran...</text><text x="652" y="257">Deskripsi</text><rect x="652" y="267" width="466" height="92" rx="9" fill="white" stroke="#cbd5e1"/><text x="668" y="292" fill="#94a3b8">Ceritakan karya, inovasi, atau praktik baik.</text><text x="652" y="397">Tautan karya (opsional)</text><rect x="652" y="407" width="466" height="40" rx="9" fill="white" stroke="#cbd5e1"/><text x="668" y="432" fill="#94a3b8">https://...</text></g><rect x="652" y="502" width="466" height="46" rx="11" fill="#2563eb"/><text x="885" y="531" text-anchor="middle" font-size="15" font-weight="700" fill="white">Kirim untuk ditinjau</text><text x="652" y="594" font-size="12" fill="#64748b">Berita dan materi pembelajaran memakai pola review yang sama.</text></g>
</svg>
