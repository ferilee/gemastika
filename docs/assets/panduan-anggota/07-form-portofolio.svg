<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Ilustrasi modal tambah portofolio</title>
  <desc id="desc">Formulir portofolio anggota dengan judul, sekolah, deskripsi, tautan, dan tombol kirim.</desc>
  <rect width="1100" height="620" fill="#eef2f8"/><rect x="80" y="28" width="940" height="564" rx="22" fill="white" stroke="#dbe5f3"/><text x="112" y="78" font-family="Arial" font-size="25" font-weight="800" fill="#151a38">Portofolio saya</text><text x="112" y="105" font-family="Arial" font-size="15" fill="#64748b">Karya dan praktik baik yang dibuat menggunakan akun ini.</text><text x="550" y="164" text-anchor="middle" font-family="Arial" font-size="15" fill="#71809b">Belum ada karya di portofolio Anda.</text><rect x="112" y="210" width="876" height="344" rx="18" fill="#f4f8ff" stroke="#cfe0ff"/><text x="138" y="250" font-family="Arial" font-size="15" font-weight="800" fill="#1e293b">Tambah portofolio</text><rect x="138" y="270" width="390" height="42" rx="10" fill="white" stroke="#cbd5e1"/><text x="154" y="297" font-family="Arial" font-size="14" fill="#94a3b8">Judul karya</text><rect x="546" y="270" width="416" height="42" rx="10" fill="white" stroke="#cbd5e1"/><text x="562" y="297" font-family="Arial" font-size="14" fill="#334155">SMK Negeri 1 Bandung</text><rect x="138" y="328" width="824" height="92" rx="10" fill="white" stroke="#cbd5e1"/><text x="154" y="355" font-family="Arial" font-size="14" fill="#94a3b8">Deskripsi karya, inovasi, atau praktik baik</text><rect x="138" y="438" width="390" height="42" rx="10" fill="white" stroke="#cbd5e1"/><text x="154" y="465" font-family="Arial" font-size="14" fill="#94a3b8">Tautan karya (opsional)</text><rect x="546" y="438" width="416" height="42" rx="10" fill="white" stroke="#cbd5e1"/><text x="562" y="465" font-family="Arial" font-size="14" fill="#94a3b8">Tautan gambar (opsional)</text><rect x="138" y="500" width="824" height="40" rx="10" fill="#5b00e8"/><text x="550" y="526" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="white">Kirim portofolio</text>
</svg>
